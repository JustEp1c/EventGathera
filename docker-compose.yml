version: '3.8'

services:
  # ─────────────────────────── Инфраструктура обмена сообщениями ───────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: eventapi-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - event-network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: eventapi-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks:
      - event-network
  
  # ─────────────────────────── Сервис кеширования (Redis) ───────────────────────────
  redis:
    image: redis:7
    container_name: eventapi-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - event-network
  # ─────────────────────────── Сервисы системы наблюдаемости ───────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: eventapi-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - event-network
  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: eventapi-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
    volumes:
      - jaeger-data:/badger 
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - event-network
  # ─────────────────────────── Базы данных (по одной на сервис) ───────────────────────────
  users-db:
    image: postgres:16
    container_name: eventapi-users-db
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - event-network

  events-db:
    image: postgres:16
    container_name: eventapi-events-db
    environment:
      POSTGRES_DB: events_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - events-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - event-network

  bookings-db:
    image: postgres:16
    container_name: eventapi-bookings-db
    environment:
      POSTGRES_DB: bookings_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - bookings-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - event-network

  # ─────────────────────────── Сервисы ───────────────────────────
  users-service:
    build:
      context: .
      dockerfile: src/services/EventGathera.UserService/EventGathera.Users.Presentation/Dockerfile
    container_name: eventapi-users-service
    depends_on:
      users-db:
        condition: service_healthy
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=users-db;Port=5432;Database=users_db;Username=postgres;Password=postgres
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=event-gathera
      - JwtSettings__Audience=event-gathera
      - JwtSettings__ExpiryMinutes=15
      - Otlp__Endpoint=http://jaeger:4317 
    networks:
      - event-network
    restart: unless-stopped

  events-service:
    build:
      context: .
      dockerfile: src/services/EventGathera.EventService/EventGathera.Events.Presentation/Dockerfile
    container_name: eventapi-events-service
    depends_on:
      events-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5001:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=events-db;Port=5432;Database=events_db;Username=postgres;Password=postgres
      - Kafka__BootstrapServers=kafka:29092
      - Kafka__ConsumerGroup=events-service-group
      - Redis__EndPoints=redis:6379
      - Redis__Password=${REDIS_PASSWORD}
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=event-gathera
      - JwtSettings__Audience=event-gathera
      - JwtSettings__ExpiryMinutes=15
      - Otlp__Endpoint=http://jaeger:4317 
    networks:
      - event-network
    restart: unless-stopped

  bookings-service:
    build:
      context: .
      dockerfile: src/services/EventGathera.BookingService/EventGathera.Bookings.Presentation/Dockerfile
    container_name: eventapi-bookings-service
    depends_on:
      bookings-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "5002:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=bookings-db;Port=5432;Database=bookings_db;Username=postgres;Password=postgres
      - Kafka__BootstrapServers=kafka:29092
      - Kafka__ConsumerGroup=bookings-service-group
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=event-gathera
      - JwtSettings__Audience=event-gathera
      - JwtSettings__ExpiryMinutes=15
      - Otlp__Endpoint=http://jaeger:4317 
    networks:
      - event-network
    restart: unless-stopped

volumes:
  users-db-data:
  events-db-data:
  bookings-db-data:
  redis-data:
  prometheus-data:
  jaeger-data:

networks:
  event-network:
    driver: bridge